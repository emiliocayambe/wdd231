<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 1150" width="100%" style="background:#ffffff; border:1px solid #ccc;">
  <!-- Grid & Guides -->
  <style>
    rect { fill: #f2f2f2; stroke: #666666; stroke-width: 1.5; }
    text { font-family: sans-serif; font-size: 11px; fill: #333333; text-anchor: middle; font-weight: bold; }
    line { stroke: #666666; stroke-width: 1.5; }
  </style>

  <!-- Header -->
  <rect x="10" y="10" width="355" height="50" rx="4" />
  <text x="70" y="40">LOGO / TITLE</text>
  <rect x="315" y="20" width="35" height="30" rx="3" />
  <text x="332" y="38">☰</text>

  <!-- Hero Section -->
  <rect x="10" y="70" width="355" height="180" rx="4" />
  <text x="187" y="110">HERO HEADING (H1)</text>
  <text x="187" y="135">Subheading / Value Proposition</text>
  <rect x="87" y="170" width="200" height="40" rx="20" fill="#e0e0e0" />
  <text x="187" y="195">[ Primary CTA Button ]</text>

  <!-- Services Section -->
  <text x="187" y="280">OUR SERVICES</text>
  <!-- Card 1 -->
  <rect x="10" y="300" width="355" height="90" rx="4" />
  <rect x="25" y="315" width="35" height="35" rx="4" />
  <text x="187" y="335">Service 1 Title</text>
  <text x="187" y="360">Short description of service...</text>
  <!-- Card 2 -->
  <rect x="10" y="400" width="355" height="90" rx="4" />
  <rect x="25" y="415" width="35" height="35" rx="4" />
  <text x="187" y="435">Service 2 Title</text>
  <text x="187" y="460">Short description of service...</text>
  <!-- Card 3 -->
  <rect x="10" y="500" width="355" height="90" rx="4" />
  <rect x="25" y="515" width="35" height="35" rx="4" />
  <text x="187" y="535">Service 3 Title</text>
  <text x="187" y="560">Short description of service...</text>

  <!-- Pricing Section -->
  <text x="187" y="625">PRICING TIERS</text>
  <!-- Pricing Card Basic -->
  <rect x="10" y="640" width="355" height="110" rx="4" />
  <text x="187" y="670">Basic Plan - $49/mo</text>
  <rect x="87" y="695" width="200" height="30" rx="4" />
  <text x="187" y="715">Select Plan</text>
  <!-- Pricing Card Popular -->
  <rect x="10" y="760" width="355" height="120" rx="4" stroke-width="3" />
  <text x="187" y="785">[ POPULAR BADGE ]</text>
  <text x="187" y="805">Pro Plan - $129/mo</text>
  <rect x="87" y="825" width="200" height="30" rx="4" />
  <text x="187" y="845">Select Plan</text>

  <!-- Assessment Form -->
  <rect x="10" y="895" width="355" height="150" rx="6" />
  <text x="187" y="925">CONTACT / ASSESSMENT FORM</text>
  <rect x="30" y="940" width="315" height="25" rx="3" />
  <rect x="30" y="975" width="315" height="25" rx="3" />
  <rect x="87" y="1010" width="200" height="25" rx="4" />
  <text x="187" y="1027">Submit</text>

  <!-- Footer -->
  <rect x="10" y="1055" width="355" height="85" rx="4" />
  <text x="187" y="1080">Company Info | Social Icons</text>
  <text x="187" y="1110">© 2026 Chatsqui API Solutions</text>
</svg>
